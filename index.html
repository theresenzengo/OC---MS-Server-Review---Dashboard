<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Licensing Tracker - Oetker Collection</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Microsoft Server Licensing Tracker for Oetker Collection - SAM Dashboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MS Licensing">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><circle cx='30' cy='30' r='12' fill='%23E87A2A'/><circle cx='50' cy='22' r='18' fill='%23E87A2A'/><circle cx='30' cy='60' r='18' fill='%23E87A2A'/><circle cx='50' cy='75' r='12' fill='%23E87A2A'/><circle cx='22' cy='78' r='8' fill='%23E87A2A'/></svg>">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: linear-gradient(160deg, #1a1a2e 0%, #1a2744 40%, #16213e 70%, #1a1a2e 100%);
      --text-primary: #1a1a2e;
      --text-secondary: #5a5a6e;
      --text-muted: #8a8a9a;
      --text-light: #ffffff;
      --accent-orange: #E87A2A;
      --accent-orange-light: #F5923D;
      --accent-orange-bg: rgba(232, 122, 42, 0.1);
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.1);
      --accent-yellow: #f59e0b;
      --accent-yellow-bg: rgba(245, 158, 11, 0.1);
      --accent-red: #ef4444;
      --accent-red-bg: rgba(239, 68, 68, 0.1);
      --accent-blue: #3b82f6;
      --accent-blue-bg: rgba(59, 130, 246, 0.1);
      --accent-purple: #8b5cf6;
      --accent-purple-bg: rgba(139, 92, 246, 0.1);
      --accent-cyan: #06b6d4;
      --accent-cyan-bg: rgba(6, 182, 212, 0.1);
      --accent-rose: #f43f5e;
      --accent-rose-bg: rgba(244, 63, 94, 0.1);
      --border-color: #c8c8d0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.15);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.25);
      --gradient-header: linear-gradient(135deg, #1a1a2e 0%, #1e3a5f 40%, #3b82f6 100%);
      --gradient-card: linear-gradient(180deg, #e5e5eb 0%, #c8c8d0 100%);
      --gradient-orange: linear-gradient(135deg, #E87A2A 0%, #F5923D 100%);
      --card-dark: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg-page); color: var(--text-light); min-height: 100vh; }
    .app-container { max-width: 1600px; margin: 0 auto; padding: 2rem; padding-top: 1rem; }
    
    /* Header - Sticky */
    .header-wrapper {
      position: sticky;
      top: 1rem;
      z-index: 50;
      margin-bottom: 2rem;
    }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 1rem 2rem; 
      background: var(--gradient-header); 
      border-radius: 16px;
      box-shadow: var(--shadow-md); 
    }
    .logo-section { display: flex; align-items: center; gap: 1.5rem; }
    .logo-img { height: 40px; width: auto; }
    .logo-text h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-light); }
    .logo-text span { font-size: 0.85rem; color: rgba(255,255,255,0.7); }
    .data-source-badge { 
      font-size: 0.65rem; 
      color: #fbbf24; 
      background: rgba(251, 191, 36, 0.15); 
      border: 1px solid rgba(251, 191, 36, 0.3); 
      padding: 0.2rem 0.5rem; 
      border-radius: 4px; 
      margin-left: 0.5rem;
    }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .section-header-spacer { flex: 1; }
    .export-btn {
      background: transparent;
      border: 1px solid rgba(232, 122, 42, 0.4);
      color: #E87A2A;
      width: 150px;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .export-btn:hover {
      background: rgba(232, 122, 42, 0.1);
      border-color: #E87A2A;
    }
    .last-update { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: rgba(255,255,255,0.6); }
    .loading-indicator { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--accent-orange); margin-top: 0.25rem; }
    .loading-dot { width: 8px; height: 8px; background: var(--accent-orange); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    /* Subsidiary Filter */
    .subsidiary-filter {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255,255,255,0.1);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .subsidiary-filter label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .subsidiary-filter select {
      background: transparent;
      border: none;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding-right: 1rem;
    }
    .subsidiary-filter select option { background: #1a1a2e; color: white; }
    .subsidiary-filter select:focus { outline: none; }
    
    /* KPI Grid - 5 cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card { 
      background: var(--gradient-card); 
      border-radius: 12px; 
      padding: 1.25rem; 
      position: relative; 
      box-shadow: var(--shadow-sm); 
      overflow: hidden; 
    }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient-orange); }
    .kpi-card.green::before { background: var(--accent-green); }
    .kpi-card.yellow::before { background: var(--accent-yellow); }
    .kpi-card.red::before { background: var(--accent-red); }
    .kpi-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .kpi-value { font-size: 2rem; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--text-primary); }
    .kpi-subtitle { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; }
    
    /* Main License Section */
    .license-section {
      margin-bottom: 2rem;
    }
    @media (max-width: 1100px) { 
      .license-section { 
        margin-bottom: 1.5rem;
      }
    }
    
    /* Compliance Bars */
    .compliance-panel {
      display: flex;
      flex-direction: column;
    }
    
    /* Section Title */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.7);
    }
    .estimated-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #E87A2A;
      font-style: italic;
    }
    .pending-badge {
      font-size: 0.7rem;
      font-weight: 500;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      animation: pulse-pending 2s ease-in-out infinite;
    }
    @keyframes pulse-pending {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .na-badge {
      font-size: 0.7rem;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(100, 116, 139, 0.15);
      border: 1px solid rgba(100, 116, 139, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
    }
    .surplus-badge {
      font-size: 0.7rem;
      font-weight: 500;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
    }
    
    /* EOS Warning Badge */
    .eos-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(245, 158, 11, 0.15) 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .eos-badge:hover {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.3) 0%, rgba(245, 158, 11, 0.25) 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
    }
    .eos-badge-icon {
      font-size: 1.1rem;
    }
    .eos-badge-text {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fbbf24;
    }
    .eos-badge-count {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fcd34d;
      background: rgba(0,0,0,0.2);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }
    .compliance-bars {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }
    .compliance-row {
      display: flex;
      gap: 1rem;
      align-items: stretch;
    }
    .compliance-bar-item {
      background: var(--card-dark);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.08);
      flex: 1;
    }
    
    /* License Recommendation Card */
    .license-rec-card {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(220, 38, 38, 0.1) 100%);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      width: 150px;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .license-rec-card.compliant {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.1) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .license-rec-card.pending {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(245, 158, 11, 0.1) 100%);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .license-rec-card.pending .license-rec-check {
      color: #fbbf24;
    }
    .license-rec-card.pending .license-rec-status {
      color: #fbbf24;
    }
    .license-rec-card.na {
      background: linear-gradient(135deg, rgba(100, 116, 139, 0.15) 0%, rgba(71, 85, 105, 0.1) 100%);
      border: 1px solid rgba(100, 116, 139, 0.3);
    }
    .license-rec-card.na .license-rec-check {
      color: #94a3b8;
      font-size: 1.8rem;
    }
    .license-rec-card.na .license-rec-status {
      color: #94a3b8;
    }
    .license-rec-card.surplus {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.1) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .license-rec-card.surplus .license-rec-check {
      font-size: 1.2rem;
      margin-bottom: 0.1rem;
    }
    .license-rec-card.surplus .license-rec-status {
      color: #34d399;
      font-size: 0.65rem;
    }
    .license-rec-surplus {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #34d399;
      margin-top: 0.2rem;
    }
    .license-rec-header {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
    }
    .license-rec-icon {
      font-size: 0.85rem;
    }
    .license-rec-title {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fca5a5;
    }
    .license-rec-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: #fca5a5;
      line-height: 1;
    }
    .license-rec-sku {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.6);
      margin-top: 0.35rem;
      line-height: 1.3;
    }
    .license-rec-check {
      font-size: 1.5rem;
      color: #34d399;
      margin-bottom: 0.25rem;
    }
    .license-rec-status {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #34d399;
    }
    .license-rec-renew {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: white;
      margin-top: 0.3rem;
    }
    .license-rec-saving {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: #34d399;
      margin-top: 0.1rem;
    }
    @media (max-width: 900px) {
      .compliance-row {
        flex-direction: column;
      }
      .license-rec-card {
        min-width: 100%;
        flex-direction: row;
        justify-content: space-between;
        padding: 0.75rem 1rem;
      }
      .license-rec-header {
        margin-bottom: 0;
      }
      .license-rec-value {
        font-size: 1.2rem;
      }
    }
    .compliance-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .compliance-bar-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .compliance-bar-metric {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.1);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .compliance-bar-values {
      font-size: 0.8rem;
      font-family: 'Space Mono', monospace;
      color: rgba(255,255,255,0.7);
    }
    .compliance-bar-values .required { color: var(--accent-orange); font-weight: 600; }
    .compliance-bar-values .entitled { color: rgba(255,255,255,0.5); }
    .compliance-bar-container {
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .compliance-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s ease;
      position: relative;
    }
    .compliance-bar-fill.compliant {
      background: linear-gradient(90deg, #10b981, #34d399);
    }
    .compliance-bar-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }
    .compliance-bar-fill.over {
      background: repeating-linear-gradient(
        90deg,
        #ef4444 0%,
        #f87171 50%,
        #ef4444 100%
      );
      animation: pulse-bar 2s ease-in-out infinite;
    }
    @keyframes pulse-bar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    .compliance-bar-marker {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 3px;
      background: white;
      border-radius: 2px;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .compliance-bar-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
    }
    .compliance-percentage {
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
    }
    .compliance-percentage.compliant { color: #10b981; }
    .compliance-percentage.warning { color: #f59e0b; }
    .compliance-percentage.over { color: #ef4444; }
    .compliance-gap {
      font-size: 0.75rem;
      font-family: 'Space Mono', monospace;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .compliance-gap.surplus { background: var(--accent-green-bg); color: #10b981; }
    .compliance-gap.deficit { background: var(--accent-red-bg); color: #ef4444; }
    
    /* No Data State */
    .no-data-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
    .no-data-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .no-data-text {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .no-data-subtext {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
    }
    
    /* EOS Modal */
    .eos-modal {
      background: linear-gradient(135deg, #2d2a1a 0%, #1a1a2e 100%);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 450px;
      width: 100%;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .eos-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(251, 191, 36, 0.2);
    }
    .eos-modal-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fbbf24;
    }
    .eos-modal-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .eos-modal-close:hover {
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .eos-modal-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: #fcd34d;
      margin-bottom: 0.25rem;
    }
    .eos-modal-label {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 1.25rem;
    }
    .eos-modal-breakdown {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .eos-modal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }
    .eos-modal-item-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .eos-modal-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    .eos-modal-dot.critical { background: #ef4444; }
    .eos-modal-dot.high { background: #f97316; }
    .eos-modal-dot.medium { background: #eab308; }
    .eos-modal-item-label {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }
    .eos-modal-item-count {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: white;
    }
    .eos-modal-affected {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      font-style: italic;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    /* Entitlements Modal */
    .entitlements-modal {
      background: linear-gradient(160deg, #1e3a5f 0%, #1a2744 50%, #1a1a2e 100%);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 700px;
      width: 95%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .entitlements-table-wrapper {
      overflow-x: auto;
      margin: 1rem 0;
    }
    .entitlements-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .entitlements-table th {
      background: rgba(255,255,255,0.1);

<body>
  <div id="root"></div>
  <script type="text/babel">
    const CONFIG = {
      GOOGLE_SHEETS: {
        ENABLED: true,
        API_KEY: 'AIzaSyC3r5qFtls2lC98vSFWQX5bTN_D9ErDxF0',
        SPREADSHEET_ID: '1PlFCpy70ZGVmXKL5hFhmLjhhJp-1PWbV3_wz_T5g6EE',
        SHEETS: { DATA: 'Data', ENTITLEMENTS: 'Entitlements', REQUIREMENTS: 'Requirements' }
      },
      AUTO_REFRESH_MINUTES: 5
    };

    const WORKFLOW_STEPS = ["Questionnaire sent", "Questionnaire received", "Initial analysis", "Follow-up sent", "Additional data received", "RVTools received", "SQL scripts received", "Final analysis", "Report delivered"];

    // ==========================================
    // FETCH ALL SHEETS DYNAMICALLY
    // ==========================================
    async function fetchSheet(sheetName) {
      const { API_KEY, SPREADSHEET_ID } = CONFIG.GOOGLE_SHEETS;
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(sheetName)}?key=${API_KEY}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Failed to fetch sheet: ${sheetName}`);
      const data = await response.json();
      const rows = data.values;
      if (!rows || rows.length < 2) return [];
      const headers = rows[0];
      return rows.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h.toLowerCase().replace(/\s+/g, '_')] = row[i] || '';
        });
        return obj;
      });
    }

    function parseDataSheet(rows) {
      return rows.map(row => {
        const numFields = ['esxi_hosts','total_physical_cores','total_vms','windows_vms','sql_instances','users'];
        numFields.forEach(f => { row[f] = row[f] === '' ? '' : parseInt(row[f]) || 0; });
        if (typeof row.response_rate === 'string') row.response_rate = parseInt(row.response_rate) || 0;
        if (typeof row.steps === 'string') row.steps = row.steps.split(',').map(v => v.trim().toLowerCase() === 'true');
        if (!row.steps || !Array.isArray(row.steps)) row.steps = Array(9).fill(false);
        if (!row.subsidiary) row.subsidiary = 'Martin Braun';
        // Map new column names to legacy names for backward compatibility
        row.ws_deployed = row.windows_vms !== undefined ? row.windows_vms : '';
        row.sql_deployed = row.sql_instances !== undefined ? row.sql_instances : '';
        row.rds_deployed = (row.rds_in_use || '').replace(/^No.*$/i, '').replace(/^N\/A$/i, '') || '';
        row.infrastructure_summary = row.critical_notes || '';
        row.ws_licenses_required = '';
        row.sql_licenses_required = '';
        row.rds_licenses_required = '';
        row.critical_points = row.eos_risk || '';
        row.missing_data = '';
        return row;
      });
    }

    function parseEntitlementsSheet(rows) {
      const result = {};
      rows.forEach(row => {
        const name = row.subsidiary;
        if (!name) return;
        result[name] = {
          ws_datacenter: parseInt(row.ws_datacenter) || 0,
          ws_standard: parseInt(row.ws_standard) || 0,
          sql_enterprise: parseInt(row.sql_enterprise) || 0,
          sql_standard: parseInt(row.sql_standard) || 0,
          rds_cals: parseInt(row.rds_cals) || 0,
          hasData: true,
          source: row.source || 'G3 License',
          notes: row.notes || ''
        };
      });
      return result;
    }

    function parseRequirementsSheet(rows) {
      const result = {};
      rows.forEach(row => {
        const name = row.subsidiary;
        if (!name) return;
        result[name] = {
          ws_datacenter: parseInt(row.ws_datacenter) || 0,
          ws_standard: parseInt(row.ws_standard) || 0,
          sql_enterprise: parseInt(row.sql_enterprise) || 0,
          sql_standard: parseInt(row.sql_standard) || 0,
          rds_cals: parseInt(row.rds_cals) || 0,
          ws_deployed: parseInt(row.ws_deployed) || 0,
          sql_deployed: parseInt(row.sql_deployed) || 0,
          rds_deployed: parseInt(row.rds_deployed) || 0,
          notes: row.notes || ''
        };
      });
      return result;
    }

    async function fetchAllSheets() {
      const { SHEETS } = CONFIG.GOOGLE_SHEETS;
      const results = { data: [], entitlements: {}, requirements: {}, warnings: [] };

      // Fetch each sheet independently — never block on missing tabs
      try { results.data = parseDataSheet(await fetchSheet(SHEETS.DATA)); }
      catch(e) { results.warnings.push(`Data: ${e.message}`); }

      try { results.entitlements = parseEntitlementsSheet(await fetchSheet(SHEETS.ENTITLEMENTS)); }
      catch(e) { results.warnings.push(`Entitlements tab not found — create it in Google Sheets`); }

      try { results.requirements = parseRequirementsSheet(await fetchSheet(SHEETS.REQUIREMENTS)); }
      catch(e) { results.warnings.push(`Requirements tab not found — create it in Google Sheets`); }

      if (results.warnings.length) console.warn('Sheet warnings:', results.warnings);
      return results;
    }

    // ==========================================
    // COMPLIANCE BAR COMPONENT (unchanged)
    // ==========================================
    function ComplianceBar({ label, metric, required, entitled, icon, sku }) {
      const percentage = entitled > 0 ? Math.round((required / entitled) * 100) : (required > 0 ? 999 : 0);
      const isCompliant = percentage <= 100;
      const isWarning = percentage > 80 && percentage <= 100;
      const isOver = percentage > 100;
      const gap = entitled - required;
      const fillWidth = Math.min(isOver ? 100 : percentage, 100);
      const deficit = gap < 0 ? Math.abs(gap) : 0;
      const isCAL = metric.toLowerCase().includes('cal');
      const packsNeeded = isCAL ? deficit : Math.ceil(deficit / 2);
      let statusClass = 'compliant';
      if (isOver) statusClass = 'over';
      else if (isWarning) statusClass = 'warning';
      
      return (
        <div className="compliance-row">
          <div className="compliance-bar-item">
            <div className="compliance-bar-header">
              <div className="compliance-bar-label">
                <span>{icon}</span>
                <span>{label}</span>
                <span className="compliance-bar-metric">{metric}</span>
              </div>
              <div className="compliance-bar-values">
                <span className="required">{required.toLocaleString()}</span>
                <span className="entitled"> / {entitled.toLocaleString()}</span>
              </div>
            </div>
            <div className="compliance-bar-container">
              <div className={`compliance-bar-fill ${statusClass}`} style={{ width: `${fillWidth}%` }} />
              {entitled > 0 && <div className="compliance-bar-marker" style={{ left: `${Math.min(100, (entitled / Math.max(required, entitled)) * 100)}%` }}></div>}
            </div>
            <div className="compliance-bar-footer">
              <span className={`compliance-percentage ${statusClass}`}>
                {percentage > 999 ? '∞' : `${percentage}%`} {isCompliant ? '✓' : '⚠'}
              </span>
              <span className={`compliance-gap ${gap >= 0 ? 'surplus' : 'deficit'}`}>
                {gap >= 0 ? `+${gap.toLocaleString()}` : `${gap.toLocaleString()}`} {isCAL ? 'CALs' : 'cores'}
              </span>
            </div>
          </div>
          {deficit > 0 && sku && (
            <div className="license-rec-card">
              <div className="license-rec-header"><span className="license-rec-icon">📦</span><span className="license-rec-title">Required</span></div>
              <div className="license-rec-value">{packsNeeded.toLocaleString()}</div>
              <div className="license-rec-sku">{sku}</div>
            </div>
          )}
          {deficit === 0 && required > 0 && (
            <div className="license-rec-card compliant">
              <div className="license-rec-check">✓</div>
              <div className="license-rec-status">Compliant</div>
              <div className="license-rec-renew">Renew: {isCAL ? required.toLocaleString() : Math.ceil(required/2).toLocaleString()}</div>
              {gap > 0 && <div className="license-rec-saving">(-{isCAL ? gap.toLocaleString() : Math.ceil(gap/2).toLocaleString()})</div>}
            </div>
          )}
          {deficit === 0 && required === 0 && entitled > 0 && (
            <div className="license-rec-card surplus">
              <div className="license-rec-check">💰</div>
              <div className="license-rec-status">Surplus</div>
              <div className="license-rec-surplus">+{entitled.toLocaleString()}</div>
            </div>
          )}
          {required === 0 && entitled === 0 && (
            <div className="license-rec-card na">
              <div className="license-rec-check">—</div>
              <div className="license-rec-status">N/A</div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // PDF GENERATION (unchanged - uses passed-in data)
    // ==========================================
    function generatePDF(data, entitled, required, kpis) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 20;
      let y = 20;
      const addTitle = (text, size = 16) => { doc.setFontSize(size); doc.setFont('helvetica', 'bold'); doc.setTextColor(26, 26, 46); doc.text(text, margin, y); y += size * 0.5 + 5; };
      const addText = (text, size = 10) => { doc.setFontSize(size); doc.setFont('helvetica', 'normal'); doc.setTextColor(60, 60, 60); const lines = doc.splitTextToSize(text, pageWidth - 2 * margin); doc.text(lines, margin, y); y += lines.length * size * 0.4 + 3; };
      const addLine = () => { doc.setDrawColor(200, 200, 200); doc.line(margin, y, pageWidth - margin, y); y += 5; };

        doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(22, 163, 74);
        doc.text('✓ No immediate purchases required. Review renewal quantities below.', margin + 10, y + 13);
        y += 28;

      // Renewal Recommendations

      const renewItems = [];
      products.forEach(p => { const gap = p.ent - p.req; if (gap > 0 && p.req > 0) { renewItems.push({ name: p.name, renew: p.unit === 'CALs' ? p.req : Math.ceil(p.req / 2), save: p.unit === 'CALs' ? gap : Math.ceil(gap / 2) }); } });
      if (renewItems.length > 0) {
        renewItems.forEach(item => {

      doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
      doc.text('Unit', margin + 2, y + 5); doc.text('Subsidiary', margin + 45, y + 5);
      doc.text('Status', margin + 85, y + 5); doc.text('Priority', margin + 115, y + 5);
      doc.text('Response', margin + 140, y + 5); y += 10;
      doc.setFont('helvetica', 'normal');
      data.filter(bu => bu.questionnaire_status !== 'Out of Scope').forEach(bu => {
        checkNewPage(8);
        doc.text((bu.unit_name || '').substring(0, 20), margin + 2, y + 4);
        doc.text((bu.subsidiary || '').substring(0, 18), margin + 45, y + 4);
        doc.text(bu.questionnaire_status || '', margin + 85, y + 4);
        doc.text(bu.priority || '-', margin + 115, y + 4);
        doc.text((bu.response_rate || 0) + '%', margin + 140, y + 4);
        y += 7;
      });
      const totalPages = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150, 150, 150); doc.text('Confidential - Oetker Collection Microsoft Licensing Assessment', margin, 290); doc.text(`Page ${i} of ${totalPages}`, pageWidth - margin - 20, 290); }
      doc.save('Oetker_MS_Licensing_Report_' + new Date().toISOString().split('T')[0] + '.pdf');
    }

    // ==========================================
    // MAIN APP - ALL DATA FROM GOOGLE SHEETS
    // ==========================================
    function App() {
      const [data, setData] = React.useState([]);
      const [entitlements, setEntitlements] = React.useState({});
      const [requirements, setRequirements] = React.useState({});
      const [loading, setLoading] = React.useState(true);
      const [lastUpdate, setLastUpdate] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState("all");
      const [searchTerm, setSearchTerm] = React.useState("");
      const [selectedBU, setSelectedBU] = React.useState(null);
      const [subsidiaryFilter, setSubsidiaryFilter] = React.useState("all");
      const [showEOS, setShowEOS] = React.useState(false);
      const [showEntitlements, setShowEntitlements] = React.useState(false);
      const [fetchError, setFetchError] = React.useState(null);
      const [sheetWarnings, setSheetWarnings] = React.useState([]);

      // Fetch all 3 sheets on load + auto-refresh
      React.useEffect(() => {
        if (!CONFIG.GOOGLE_SHEETS.ENABLED) return;
        const load = async () => {
          setLoading(true);
          try {
            const result = await fetchAllSheets();
            if (result.data.length) setData(result.data);
            setEntitlements(prev => Object.keys(result.entitlements).length ? result.entitlements : prev);
            setRequirements(prev => Object.keys(result.requirements).length ? result.requirements : prev);
            setSheetWarnings(result.warnings || []);
            setLastUpdate(new Date());
            setFetchError(null);
          } catch(e) {
            console.error('Fetch error:', e);
            setFetchError(e.message);
          }
          setLoading(false);
        };
        load();
        if (CONFIG.AUTO_REFRESH_MINUTES > 0) {
          const i = setInterval(load, CONFIG.AUTO_REFRESH_MINUTES * 60000);
          return () => clearInterval(i);
        }
      }, []);

      // Derive subsidiaries dynamically from data
      const subsidiaries = React.useMemo(() => {
        const subs = [...new Set(data.map(bu => bu.subsidiary).filter(Boolean))];
        // Stable order: known ones first, then any new
        const order = ["Martin Braun", "Budenheim", "Henkell Freixenet", "OE. Hotels"];
        return [...order.filter(s => subs.includes(s)), ...subs.filter(s => !order.includes(s))];
      }, [data]);

      const subsidiaryFiltered = subsidiaryFilter === "all" 
        ? data 
        : data.filter(bu => bu.subsidiary === subsidiaryFilter);

      const filtered = subsidiaryFiltered.filter(bu => {
        const match = (bu.unit_name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                      (bu.country || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                      (bu.unit_id || '').toLowerCase().includes(searchTerm.toLowerCase());
        if (activeTab === "all") return match;
        if (activeTab === "high") return match && (bu.priority === "High" || bu.priority === "Critical" || bu.priority === "HIGH" || bu.priority === "CRITICAL");
        if (activeTab === "pending") return match && ((bu.questionnaire_status || '').includes("Pending") || (bu.questionnaire_status || '').includes("Progress") || (bu.response_rate || 0) < 70);
        if (activeTab === "complete") return match && bu.questionnaire_status === "Complete";
        return match;
      });

      // Calculate aggregated license data — ALL from sheets
      const getAggregatedLicenses = () => {
        if (subsidiaryFilter === "all") {
          const allEnts = Object.values(entitlements);
          const allReqs = Object.values(requirements);
          const entitled = {
            ws_standard: allEnts.reduce((s, e) => s + (e.ws_standard || 0), 0),
            ws_datacenter: allEnts.reduce((s, e) => s + (e.ws_datacenter || 0), 0),
            sql_standard: allEnts.reduce((s, e) => s + (e.sql_standard || 0), 0),
            sql_enterprise: allEnts.reduce((s, e) => s + (e.sql_enterprise || 0), 0),
            rds_cals: allEnts.reduce((s, e) => s + (e.rds_cals || 0), 0),
          };
          const required = {
            ws_standard: allReqs.reduce((s, r) => s + (r.ws_standard || 0), 0),
            ws_datacenter: allReqs.reduce((s, r) => s + (r.ws_datacenter || 0), 0),
            sql_standard: allReqs.reduce((s, r) => s + (r.sql_standard || 0), 0),
            sql_enterprise: allReqs.reduce((s, r) => s + (r.sql_enterprise || 0), 0),
            rds_cals: allReqs.reduce((s, r) => s + (r.rds_cals || 0), 0),
            ws_deployed: allReqs.reduce((s, r) => s + (r.ws_deployed || 0), 0),
            sql_deployed: allReqs.reduce((s, r) => s + (r.sql_deployed || 0), 0),
            rds_deployed: allReqs.reduce((s, r) => s + (r.rds_deployed || 0), 0),
          };
          const hasData = allEnts.length > 0;
          return { entitled, required, hasData };
        } else {
          const entitled = entitlements[subsidiaryFilter] || {};
          const required = requirements[subsidiaryFilter] || {};
          const hasData = entitled.hasData || false;
          return { entitled, required, hasData };
        }
      };

      const { entitled, required, hasData } = getAggregatedLicenses();

      const activeData = subsidiaryFiltered.filter(b => b.questionnaire_status !== "Out of Scope" && b.questionnaire_status !== "N/A");
      const kpis = { 
        total: activeData.length, 
        complete: activeData.filter(b => b.questionnaire_status === "Complete").length,
        avg: activeData.length > 0 ? Math.round(activeData.reduce((a,b) => a + (parseInt(b.response_rate)||0), 0) / activeData.length) : 0, 
        critical: activeData.filter(b => {
          const p = (b.priority || '').toUpperCase();
          return p === 'CRITICAL' || p === 'HIGH';
        }).length, 
        pending: activeData.filter(b => {
          const s = b.questionnaire_status || '';
          return s.includes('Pending') || s.includes('Progress');
        }).length
      };

      // Compute EOS data dynamically from data
      const eosData = React.useMemo(() => {
        const eosBUs = data.filter(bu => {
          const risk = (bu.eos_risk || '').toUpperCase();
          return risk !== 'NO' && risk !== 'N/A' && risk !== '' && risk !== 'NO (WS 2016 → 2027)';
        });
        // Parse EOS versions from eos_risk field
        const versions = {};
        let totalEOS = 0;
        const affectedBUs = [];
        eosBUs.forEach(bu => {
          affectedBUs.push(bu.unit_name);
          const risk = bu.eos_risk || '';
          // Extract version mentions
          if (risk.includes('2003')) { versions['WS 2003'] = (versions['WS 2003'] || 0) + 1; totalEOS++; }
          if (risk.includes('2008')) { versions['WS 2008/R2'] = (versions['WS 2008/R2'] || 0) + 1; totalEOS++; }
          if (risk.includes('2012')) { versions['WS 2012/R2'] = (versions['WS 2012/R2'] || 0) + 1; totalEOS++; }
        });
        return { versions, totalCount: eosBUs.length, affectedBUs: [...new Set(affectedBUs)] };
      }, [data]);

      const statusClass = s => {
        if (s === "Complete") return "complete";
        if (s === "Received") return "received";
        if ((s || '').includes("Pending") || (s || '').includes("Progress")) return "pending";
        if (s === "Incomplete") return "incomplete";
        if (s === "Out of Scope" || s === "N/A") return "out-of-scope";
        if (s === "No Data") return "no-data";
        return "not-sent";
      };

      const subsidiaryClass = s => {
        if (s === "Budenheim") return "budenheim";
        if (s === "Martin Braun") return "martin-braun";
        if (s === "Henkell Freixenet") return "henkell-freixenet";
        if (s === "OE. Hotels") return "oe-hotels";
        return "martin-braun";
      };

      const hasLicense = bu => (bu.ws_deployed !== '' && bu.ws_deployed !== 0) || (bu.sql_deployed !== '' && bu.sql_deployed !== 0) || (bu.rds_deployed !== '' && bu.rds_deployed !== 0);

      // Loading state
      if (loading && data.length === 0) {
        return (
          <div className="app-container" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'80vh'}}>
            <div style={{textAlign:'center',color:'white'}}>
              <div className="loading-indicator" style={{fontSize:'1.2rem',marginBottom:'1rem'}}><div className="loading-dot"></div> Loading data from Google Sheets...</div>
              <div style={{fontSize:'0.8rem',opacity:0.6}}>Fetching Data, Entitlements & Requirements sheets</div>
            </div>
          </div>
        );
      }

      // Error state - only if NO data at all
      if (fetchError && data.length === 0) {
        return (
          <div className="app-container" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'80vh'}}>
            <div style={{textAlign:'center',color:'white',maxWidth:'400px'}}>
              <div style={{fontSize:'3rem',marginBottom:'1rem'}}>⚠️</div>
              <div style={{fontSize:'1.2rem',marginBottom:'0.5rem'}}>Unable to load data</div>
              <div style={{fontSize:'0.85rem',opacity:0.7,marginBottom:'1rem'}}>{fetchError}</div>
              <div style={{fontSize:'0.75rem',opacity:0.5}}>Check that the Google Sheet is shared publicly and the API key is valid.</div>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          <div className="header-wrapper">
            <header className="header">
              <div className="logo-section">
                <svg className="logo-img" viewBox="0 0 200 50"><circle cx="12" cy="12" r="5" fill="#E87A2A"/><circle cx="22" cy="8" r="8" fill="#E87A2A"/><circle cx="12" cy="28" r="8" fill="#E87A2A"/><circle cx="22" cy="38" r="5" fill="#E87A2A"/><circle cx="8" cy="40" r="4" fill="#E87A2A"/><text x="38" y="32" fontFamily="DM Sans" fontSize="24" fontWeight="700" fill="white">appstrato</text></svg>
                <div className="logo-text"><h1>Microsoft Licensing Tracker</h1><span>Oetker Collection <span className="data-source-badge">📊 Live from Google Sheets</span></span></div>
              </div>
              <div className="header-right">
                <div className="subsidiary-filter">
                  <label>Subsidiary:</label>
                  <select value={subsidiaryFilter} onChange={e => setSubsidiaryFilter(e.target.value)}>
                    <option value="all">All Subsidiaries</option>
                    {subsidiaries.map(s => (
                      <option key={s} value={s}>{s} {!entitlements[s]?.hasData ? '(No data)' : ''}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <div className="last-update">Updated: {lastUpdate ? lastUpdate.toLocaleString() : '—'}</div>
                  {loading && <div className="loading-indicator"><div className="loading-dot"></div> Syncing...</div>}
                </div>
              </div>
            </header>
          </div>

          {/* KPI Grid */}

            <div className="kpi-card green"><div className="kpi-label">Complete</div><div className="kpi-value">{kpis.complete}</div><div className="kpi-subtitle">{kpis.total > 0 ? Math.round(kpis.complete/kpis.total*100) : 0}%</div></div>
            <div className="kpi-card"><div className="kpi-label">Avg Response</div><div className="kpi-value">{kpis.avg}%</div></div>
            <div className="kpi-card red"><div className="kpi-label">Critical/High</div><div className="kpi-value">{kpis.critical}</div></div>
            <div className="kpi-card yellow"><div className="kpi-label">Pending</div><div className="kpi-value">{kpis.pending}</div></div>
          </div>

          {/* Sheet warnings */}
          {sheetWarnings.length > 0 && (
            <div style={{background:'rgba(245,158,11,0.15)',border:'1px solid rgba(245,158,11,0.4)',borderRadius:'8px',padding:'0.75rem 1rem',marginBottom:'1.5rem',fontSize:'0.8rem',color:'#fbbf24'}}>
              <strong>⚠️ Missing sheets:</strong> {sheetWarnings.join(' · ')}
            </div>
          )}

                  <span className="pending-badge">⏳ Deployment data pending</span>
                )}
                {subsidiaryFilter !== "all" && entitlements[subsidiaryFilter]?.notes && entitlements[subsidiaryFilter].notes.includes('SA Only') && (
                  <span className="pending-badge">⚠️ G3 shows SA Only - verify VLSC/EA</span>
                )}
                <div className="section-header-spacer"></div>

                <button className="export-btn" onClick={() => generatePDF(data, entitled, required, kpis)}>📄 Export</button>

                  <ComplianceBar label="Windows Server Standard" metric="Cores" required={required.ws_standard || 0} entitled={entitled.ws_standard || 0} icon="🖥️" sku="WS Standard 2-Core LIC+SA" />
                  <ComplianceBar label="SQL Server Enterprise" metric="Cores" required={required.sql_enterprise || 0} entitled={entitled.sql_enterprise || 0} icon="🗄️" sku="SQL Enterprise 2-Core LIC+SA" />
                  <ComplianceBar label="SQL Server Standard" metric="Cores" required={required.sql_standard || 0} entitled={entitled.sql_standard || 0} icon="🗄️" sku="SQL Standard 2-Core LIC+SA" />
                  <ComplianceBar label="RDS User CALs" metric="User CALs" required={required.rds_cals || 0} entitled={entitled.rds_cals || 0} icon="👥" sku="RDS User CAL LIC+SA" />
                </div>
              ) : (
                <div className="no-data-state">
                  <div className="no-data-icon">📊</div>
                  <div className="no-data-text">No deployment data available</div>
                  <div className="no-data-subtext">Analysis pending for {subsidiaryFilter}</div>
                </div>
              )}
            </div>
          </div>

          <div style={{fontSize:'0.7rem',color:'rgba(255,255,255,0.4)',marginTop:'-0.5rem',marginBottom:'2rem'}}>* Some BUs have pending data (TBD) - totals may increase</div>

          {/* Data Collection Section */}
          <div className="section-header">
            <span className="section-title">Data Collection & Analysis</span>
          </div>

          <div className="tabs-container">
            {[{id:"all",label:"All"},{id:"high",label:"Critical/High"},{id:"pending",label:"Pending"},{id:"complete",label:"Complete"}].map(t => <button key={t.id} className={`tab ${activeTab===t.id?'active':''}`} onClick={() => setActiveTab(t.id)}>{t.label}</button>)}
          </div>

          <div className="filter-bar">
            <input className="search-input" placeholder="🔍 Search by name, country, or ID..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            <div className="eos-badge" onClick={() => setShowEOS(true)}>
              <span className="eos-badge-icon">⚠️</span>
              <span className="eos-badge-text">End of Support</span>
              <span className="eos-badge-count">{eosData.totalCount}</span>
            </div>
          </div>

          <div className="bu-grid">
            {filtered.map(bu => (
              <div key={bu.unit_id} className="bu-card" onClick={() => setSelectedBU(bu)}>
                {bu.priority && bu.priority !== '' && <span className={`priority-badge ${bu.priority.toLowerCase()}`}>{bu.priority}</span>}
                <div className="bu-card-header">
                  <div>
                    <span className="bu-unit-badge">{bu.unit_id}</span>
                    <div className="bu-name">{bu.unit_name}</div>
                    <div className="bu-country">📍 {bu.country}</div>
                    <div className="bu-subsidiary">
                      <span className={`subsidiary-tag ${subsidiaryClass(bu.subsidiary)}`}>{bu.subsidiary}</span>
                    </div>
                    {bu.contact_name && <div style={{fontSize:'0.7rem',color:'var(--text-muted)',marginTop:'0.25rem'}}>👤 {bu.contact_name}</div>}
                  </div>
                  <span className={`status-badge ${statusClass(bu.questionnaire_status)}`}><span className="status-dot"></span>{bu.questionnaire_status}</span>
                </div>
                {bu.infrastructure_summary && <div className="bu-infra-summary">🏗️ {bu.infrastructure_summary}</div>}
                <div className="progress-section"><div className="progress-header"><span className="progress-label">Response Rate</span><span className="progress-value">{bu.response_rate}%</span></div><div className="progress-bar"><div className="progress-fill" style={{width:`${bu.response_rate}%`}}></div></div></div>
                <div className="license-summary">
                  {bu.ws_deployed !== '' && bu.ws_deployed !== 0 && <span className="license-tag ws">🖥️ WS: {bu.ws_deployed}</span>}
                  {bu.sql_deployed !== '' && bu.sql_deployed !== 0 && <span className="license-tag sql">🗄️ SQL: {bu.sql_deployed}</span>}
                  {bu.rds_deployed !== '' && bu.rds_deployed !== 0 && <span className="license-tag rds">👥 RDS: {bu.rds_deployed}</span>}
                  {!hasLicense(bu) && <span className="no-data">No license data yet</span>}
                </div>
                <div className="checklist-mini">{(bu.steps||[]).map((d,i) => <div key={i} className={`check-dot ${d?'done':''}`}></div>)}</div>
              </div>
            ))}
          </div>

          {/* BU Detail Modal */}
          {selectedBU && (
            <div className="modal-overlay" onClick={() => setSelectedBU(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <div>
                    <span className="bu-unit-badge">{selectedBU.unit_id}</span>
                    <h2 style={{fontSize:'1.5rem',marginTop:'0.5rem',color:'var(--text-primary)'}}>{selectedBU.unit_name}</h2>
                    <div className="bu-country">📍 {selectedBU.country}</div>
                    <div style={{marginTop:'0.5rem'}}><span className={`subsidiary-tag ${subsidiaryClass(selectedBU.subsidiary)}`}>{selectedBU.subsidiary}</span></div>
                    {selectedBU.contact_name && <div style={{marginTop:'0.25rem',fontSize:'0.85rem',color:'var(--text-secondary)'}}>👤 {selectedBU.contact_name}</div>}
                  </div>
                  <button className="modal-close" onClick={() => setSelectedBU(null)}>×</button>
                </div>
                <div className="modal-body">
                  <div className="detail-section"><h3>Status</h3>
                    <div className="info-grid">
                      <div className="info-item"><div className="info-label">Status</div><div className="info-value">{selectedBU.questionnaire_status}</div></div>
                      <div className="info-item"><div className="info-label">Response</div><div className="info-value">{selectedBU.response_rate}%</div></div>
                      <div className="info-item"><div className="info-label">Priority</div><div className="info-value">{selectedBU.priority || '—'}</div></div>
                      <div className="info-item"><div className="info-label">Country</div><div className="info-value">{selectedBU.country}</div></div>
                      <div className="info-item"><div className="info-label">Hypervisor</div><div className="info-value">{selectedBU.hypervisor || '—'}</div></div>
                      <div className="info-item"><div className="info-label">Hosts</div><div className="info-value">{selectedBU.esxi_hosts || '—'}</div></div>
                      <div className="info-item"><div className="info-label">Cores</div><div className="info-value">{selectedBU.total_physical_cores || '—'}</div></div>
                      <div className="info-item"><div className="info-label">Users</div><div className="info-value">{selectedBU.users || '—'}</div></div>
                      {selectedBU.vmotion_drs && <div className="info-item full-width"><div className="info-label">vMotion/DRS</div><div className="info-value">{selectedBU.vmotion_drs}</div></div>}
                      {selectedBU.infrastructure_summary && <div className="info-item full-width"><div className="info-label">Notes</div><div className="info-value infra">🏗️ {selectedBU.infrastructure_summary}</div></div>}
                    </div>
                  </div>
                  <div className="detail-section"><h3>License Requirements</h3>
                    <table className="license-table"><thead><tr><th>Product</th><th>Deployed</th><th>Details</th></tr></thead><tbody>
                      <tr><td><div className="product-cell"><span className="product-icon ws">WS</span>Windows Server</div></td><td className="value-cell">{selectedBU.ws_deployed !== '' && selectedBU.ws_deployed !== 0 ? selectedBU.ws_deployed + ' VMs' : '—'}</td><td className="required-cell">{selectedBU.ws_versions_deployed || '—'}</td></tr>
                      <tr><td><div className="product-cell"><span className="product-icon sql">SQL</span>SQL Server</div></td><td className="value-cell">{selectedBU.sql_deployed !== '' && selectedBU.sql_deployed !== 0 ? selectedBU.sql_deployed + ' inst.' : '—'}</td><td className="required-cell">{selectedBU.sql_versions_deployed || '—'}</td></tr>
                      <tr><td><div className="product-cell"><span className="product-icon rds">RDS</span>Remote Desktop</div></td><td className="value-cell">{selectedBU.rds_deployed || '—'}</td><td className="required-cell">{selectedBU.rds_in_use || '—'}</td></tr>
                    </tbody></table>
                  </div>
                  {selectedBU.eos_risk && selectedBU.eos_risk !== 'NO' && selectedBU.eos_risk !== 'N/A' && (
                    <div className="detail-section"><h3>End of Support Risk</h3><div className="alert-box"><div className="alert-title">⚠️ EOS Risk</div><div className="alert-content">{selectedBU.eos_risk}</div></div></div>
                  )}
                  <div className="detail-section"><h3>Workflow</h3><div className="checklist-full">{WORKFLOW_STEPS.map((s,i) => <div key={i} className="checklist-item"><div className={`checklist-checkbox ${(selectedBU.steps||[])[i]?'checked':''}`}></div><span className={`checklist-text ${(selectedBU.steps||[])[i]?'done':''}`}>{s}</span></div>)}</div></div>
                </div>
              </div>
            </div>
          )}

          {/* EOS Modal — DYNAMIC */}
          {showEOS && (
            <div className="modal-overlay" onClick={() => setShowEOS(false)}>
              <div className="eos-modal" onClick={e => e.stopPropagation()}>
                <div className="eos-modal-header">
                  <div className="eos-modal-title"><span>⚠️</span><span>End of Support Systems</span></div>
                  <button className="eos-modal-close" onClick={() => setShowEOS(false)}>×</button>
                </div>
                <div className="eos-modal-value">{eosData.totalCount}</div>
                <div className="eos-modal-label">BUs with End of Support Windows Server versions</div>
                <div className="eos-modal-breakdown">
                  {Object.entries(eosData.versions).sort().map(([ver, count]) => (
                    <div key={ver} className="eos-modal-item">
                      <div className="eos-modal-item-left">
                        <div className={`eos-modal-dot ${ver.includes('2003') || ver.includes('2008') ? 'critical' : 'high'}`}></div>
                        <span className="eos-modal-item-label">{ver}</span>
                      </div>
                      <span className="eos-modal-item-count">{count} BU{count > 1 ? 's' : ''}</span>
                    </div>
                  ))}
                </div>
                <div className="eos-modal-affected">
                  <strong>Affected BUs:</strong> {eosData.affectedBUs.join(', ')}
                </div>
              </div>
            </div>
          )}

          {/* Entitlements Modal — DYNAMIC from Entitlements sheet */}
          {showEntitlements && (
            <div className="modal-overlay" onClick={() => setShowEntitlements(false)}>
              <div className="entitlements-modal" onClick={e => e.stopPropagation()}>
                <div className="eos-modal-header">
                  <div className="eos-modal-title"><span>📜</span><span>License Entitlements by Subsidiary</span></div>
                  <button className="eos-modal-close" onClick={() => setShowEntitlements(false)}>×</button>
                </div>
                <div className="entitlements-table-wrapper">
                  <table className="entitlements-table">
                    <thead>
                      <tr><th>Subsidiary</th><th>WS DC</th><th>WS Std</th><th>SQL Ent</th><th>SQL Std</th><th>RDS</th><th>Source</th></tr>
                    </thead>
                    <tbody>
                      {Object.entries(entitlements).map(([name, ent]) => (
                        <tr key={name}>
                          <td className="sub-name">{name}</td>
                          <td>{(ent.ws_datacenter || 0).toLocaleString()}</td>
                          <td>{(ent.ws_standard || 0).toLocaleString()}</td>
                          <td>{(ent.sql_enterprise || 0).toLocaleString()}</td>
                          <td>{(ent.sql_standard || 0).toLocaleString()}</td>
                          <td>{(ent.rds_cals || 0).toLocaleString()}</td>
                          <td style={{fontSize:'0.7rem',opacity:0.7}}>{ent.source || ''}</td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot>
                      <tr>
                        <td className="sub-name">TOTAL</td>
                        <td>{Object.values(entitlements).reduce((s,e) => s + (e.ws_datacenter||0), 0).toLocaleString()}</td>
                        <td>{Object.values(entitlements).reduce((s,e) => s + (e.ws_standard||0), 0).toLocaleString()}</td>
                        <td>{Object.values(entitlements).reduce((s,e) => s + (e.sql_enterprise||0), 0).toLocaleString()}</td>
                        <td>{Object.values(entitlements).reduce((s,e) => s + (e.sql_standard||0), 0).toLocaleString()}</td>
                        <td>{Object.values(entitlements).reduce((s,e) => s + (e.rds_cals||0), 0).toLocaleString()}</td>
                        <td></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
                <div className="entitlements-note">
                  * All entitlement data loaded dynamically from Google Sheets "Entitlements" tab
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
